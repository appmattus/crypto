name: Build

on:
    push:
        branches:
            - main
            # The long-running branch for splitting the library into algorithm family modules
            - split
        tags:
            - '**'
    pull_request:
        branches:
            - main
            - split

jobs:
    # Runs the JS unit tests on Hermes, React Native's JavaScript engine, in parallel with the main build. The hermes
    # CLI is built from source once, then cached per runner image (it links the image's ICU) until
    # cryptohash/hermes/hermes.gradle.kts changes, for example its Hermes version.
    hermes:
        runs-on: ubuntu-latest
        timeout-minutes: 75
        steps:
            -   uses: actions/checkout@v7
            -   uses: actions/setup-java@v6
                with:
                    distribution: 'zulu'
                    java-version: '17'
                    cache: 'gradle'

            -   name: Setup Gradle
                uses: gradle/actions/setup-gradle@v6

            -   name: Hermes CLI cache
                id: hermes-cache
                uses: actions/cache@v6
                with:
                    path: ~/hermes-cli
                    key: ${{ runner.os }}-${{ env.ImageOS }}-hermes-cli-${{ hashFiles('cryptohash/hermes/hermes.gradle.kts') }}

            -   name: Build Hermes CLI
                if: steps.hermes-cache.outputs.cache-hit != 'true'
                run: |
                    sudo apt-get update
                    sudo apt-get install -y libicu-dev ninja-build
                    ./gradlew :cryptohash:buildHermes
                    mkdir -p ~/hermes-cli
                    cp cryptohash/build/hermes/*/build/bin/hermes ~/hermes-cli/

            -   name: Hermes tests
                run: ./gradlew jsHermesTest -Phermes.path=$HOME/hermes-cli/hermes

            # React Native release builds ship optimised bytecode rather than source, so run the tests that way too
            -   name: Hermes bytecode tests
                run: ./gradlew jsHermesBytecodeTest -Phermes.path=$HOME/hermes-cli/hermes

    # The checks run as parallel jobs, one per group of targets, each on the cheapest runner that can run them. Only the
    # Apple simulator tests need macOS. Gradle runs a task name in every module that has it, the samples included.
    check:
        name: check (${{ matrix.name }})
        strategy:
            fail-fast: false
            matrix:
                include:
                    -   name: detekt
                        os: ubuntu-latest
                        tasks: detekt

                    -   name: jvm
                        os: ubuntu-latest
                        tasks: jvmTest

                    # Node and browser tests, and the check that kotlin-js-store/yarn.lock is up to date
                    -   name: js
                        os: ubuntu-latest
                        tasks: jsTest kotlinStoreYarnLock

                    # wasmJs on Node and in the browser, wasmWasi on Node, and the check that the wasm yarn.lock is up to date
                    -   name: wasm
                        os: ubuntu-latest
                        tasks: wasmJsTest wasmWasiTest kotlinWasmStoreYarnLock

                    -   name: apple
                        os: macos-26
                        tasks: macosArm64Test iosSimulatorArm64Test iosX64Test watchosSimulatorArm64Test tvosSimulatorArm64Test

                    # A macOS host skips the Linux tests, so check never ran them
                    -   name: linux
                        os: ubuntu-latest
                        tasks: linuxX64Test

                    # Android lint and unit tests of the samples
                    -   name: android
                        os: ubuntu-latest
                        tasks: :samples:androidApp:check :samples:composeApp:check

        runs-on: ${{ matrix.os }}
        timeout-minutes: 75
        steps:
            -   uses: actions/checkout@v7
            -   uses: actions/setup-java@v6
                with:
                    distribution: 'zulu'
                    java-version: '17'
                    cache: 'gradle'

            -   name: Setup Gradle
                uses: gradle/actions/setup-gradle@v6

            -   name: konan cache
                uses: actions/cache@v6
                with:
                    path: ~/.konan
                    key: ${{ runner.os }}-konan

            -   name: Check
                run: ./gradlew ${{ matrix.tasks }}

            -   name: Upload artifacts
                if: failure()
                uses: actions/upload-artifact@v7
                with:
                    name: hs_err_pid-${{ matrix.name }}.log
                    path: 'hs_err_**.log'

    build:
        # Disabled on the split branch while the library is split into algorithm family modules. Remove this line to
        # re-enable it. publish needs this job, so it's skipped too.
        if: false
        runs-on: macos-26
        steps:
            -   uses: actions/checkout@v7
            -   uses: actions/setup-java@v6
                with:
                    distribution: 'zulu'
                    java-version: '17'
                    cache: 'gradle'

            -   name: Setup Gradle
                uses: gradle/actions/setup-gradle@v6

            -   name: konan cache
                uses: actions/cache@v6
                with:
                    path: ~/.konan
                    key: ${{ runner.os }}-konan

            -   name: Build
                run: ./gradlew build -x check -x lintVitalRelease

    # Releases publish only once every other job has passed
    publish:
        if: startsWith(github.ref, 'refs/tags/')
        needs: [ check, build, hermes ]
        runs-on: macos-26
        steps:
            -   uses: actions/checkout@v7
            -   uses: actions/setup-java@v6
                with:
                    distribution: 'zulu'
                    java-version: '17'
                    cache: 'gradle'

            -   name: Setup Gradle
                uses: gradle/actions/setup-gradle@v6

            -   name: konan cache
                uses: actions/cache@v6
                with:
                    path: ~/.konan
                    key: ${{ runner.os }}-konan

            -   name: Prepare tag properties
                run: |
                    echo "${{secrets.GPG_SIGNING_SECRET_KEY_RING_FILE_BASE64}}" > $HOME/.gradle/sonatype-appmattus-keys.gpg.b64
                    base64 -d -i $HOME/.gradle/sonatype-appmattus-keys.gpg.b64 -o $HOME/.gradle/sonatype-appmattus-keys.gpg
                    echo "${{secrets.GPG_GRADLE_PROPERTIES}}" > $HOME/.gradle/gradle.properties

            -   name: Upload tag
                run: ./gradlew publishAllPublicationsToMavenCentral -P"signing.secretKeyRingFile=$(echo $HOME/.gradle/sonatype-appmattus-keys.gpg)"
